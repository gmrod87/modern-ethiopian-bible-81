    </filter>
    <filter id="paperGrain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.38" numOctaves="4" seed="29" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 0.11"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
  </defs>

  <rect width="2160" height="3840" fill="url(#bg)"/>
  <rect width="2160" height="3840" fill="#FFFFFF" opacity="0.025" filter="url(#paperGrain)"/>
  <rect width="2160" height="3840" fill="url(#vignette)"/>

