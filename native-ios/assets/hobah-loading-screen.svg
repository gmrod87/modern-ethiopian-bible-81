<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="3840" viewBox="0 0 2160 3840">
  <defs>
    <radialGradient id="bg" cx="50%" cy="31%" r="92%">
      <stop offset="0" stop-color="#244B3B"/>
      <stop offset="0.42" stop-color="#153A2B"/>
      <stop offset="0.75" stop-color="#0E3024"/>
      <stop offset="1" stop-color="#08251C"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="gold" x1="0.12" y1="0.04" x2="0.88" y2="0.96">
      <stop offset="0" stop-color="#FCE89A"/>
      <stop offset="0.18" stop-color="#F6CF69"/>
      <stop offset="0.48" stop-color="#E9B64B"/>
      <stop offset="0.74" stop-color="#CA8B2A"/>
      <stop offset="1" stop-color="#F0C45D"/>
    </linearGradient>
    <linearGradient id="goldSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF5BE" stop-opacity="0.78"/>
      <stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.62" stop-color="#7E4B11" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5F390E" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="crossShadow" x="-35%" y="-35%" width="185%" height="195%">
