name: Validate Hobah Release 84

on:
  push:
    branches: [release84-study-state-machine]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-release84:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install
      - name: Build Release 84
        run: npm run build
      - name: Verify generated Study state machine
        run: |
          grep -F "const V='84';" dist/app.js
          grep -F "response.completed" dist/app.js
          grep -F "toggleStudyTransport" dist/app.js
          grep -F "waitForNativeStudyEnd" dist/app.js
          grep -F "Study AI took too long to start" dist/app.js
          grep -F "never exceed 300 words" dist/app.js
      - name: Install native dependencies
        working-directory: native-ios
        run: npm install
      - name: Prepare native web bundle
        working-directory: native-ios
        run: npm run prepare:web
      - name: Verify native transport remains recoverable
        run: |
          grep -F "response.completed" native-ios/www/app.js
          grep -F "toggleStudyTransport" native-ios/www/app.js
          grep -F "waitForNativeStudyEnd" native-ios/www/app.js
          grep -F "!state.audio.studyBusy)advanceNarration()" native-ios/www/app.js
          grep -F "apiURL('/api/study-chat')" native-ios/www/app.js
      - name: Build native bridge
        working-directory: native-ios
        run: npm run build:bridge
      - name: Validate native bundle
        working-directory: native-ios
        run: npm run doctor
      - name: Publish validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS_BRANCH="ci-release84-status"
          STATUS_FILE="$RUNNER_TEMP/release84-status.md"
          {
            echo '# Hobah Release 84 Validation'
            echo
            echo "- status: ${JOB_STATUS}"
            echo "- source_commit: ${GITHUB_SHA}"
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- checked_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$STATUS_FILE"
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${STATUS_BRANCH}" >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${STATUS_BRANCH}" -f sha="${GITHUB_SHA}" >/dev/null
          fi
          OLD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/release84-status.md?ref=${STATUS_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          ENCODED="$(base64 < "$STATUS_FILE")"
          if [ -n "$OLD_SHA" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/release84-status.md" -f message="Update Release 84 validation status" -f content="$ENCODED" -f branch="$STATUS_BRANCH" -f sha="$OLD_SHA" >/dev/null
          else
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/release84-status.md" -f message="Publish Release 84 validation status" -f content="$ENCODED" -f branch="$STATUS_BRANCH" >/dev/null
          fi
