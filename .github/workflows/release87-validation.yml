name: Validate Hobah Release 87
on:
  push:
    branches: [release87-settings-open-fix]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Verify web Settings opener
        run: |
          python3 - <<'PY'
          s=open('dist/app.js').read()
          assert "const V='87';" in s
          assert "document.querySelectorAll('.bottomNav button').forEach" in s
          assert "d.setAttribute('open','')" in s
          assert '$document.querySelectorAll' not in s
          import re
          assert not re.search(r'(^|[^$])\$\(\'\.bottomNav button\'\)\.forEach',s)
          PY
      - working-directory: native-ios
        run: npm install
      - working-directory: native-ios
        run: npm run prepare:web
      - working-directory: native-ios
        run: npm run build:bridge
      - name: Verify native Settings opener
        run: |
          python3 - <<'PY'
          s=open('native-ios/www/app.js').read()
          assert "const V='87';" in s
          assert "document.querySelectorAll('.bottomNav button').forEach" in s
          assert "d.setAttribute('open','')" in s
          assert '$document.querySelectorAll' not in s
          import re
          assert not re.search(r'(^|[^$])\$\(\'\.bottomNav button\'\)\.forEach',s)
          PY
      - working-directory: native-ios
        run: npm run doctor
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=ci-release87-status
          FILE="$RUNNER_TEMP/release87-status.md"
          {
            echo '# Hobah Release 87 Validation'
            echo
            echo "- status: ${JOB_STATUS}"
            echo "- source_commit: ${GITHUB_SHA}"
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- checked_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$FILE"
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="${GITHUB_SHA}" >/dev/null; fi
          OLD="$(gh api "repos/${GITHUB_REPOSITORY}/contents/release87-status.md?ref=${BRANCH}" --jq '.sha' 2>/dev/null || true)"
          ENC="$(base64 < "$FILE")"
          if [ -n "$OLD" ]; then gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/release87-status.md" -f message='Update Release 87 status' -f content="$ENC" -f branch="$BRANCH" -f sha="$OLD" >/dev/null; else gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/release87-status.md" -f message='Publish Release 87 status' -f content="$ENC" -f branch="$BRANCH" >/dev/null; fi
