name: Build Audited Ancient Library V3

on:
  push:
    branches: [ancient-library-complete-book]
    paths:
      - 'ancient-library/build_complete_ancient_library_v3_audited.py'
      - '.github/workflows/build-audited-ancient-library-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audited:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Ancient Library research branch
        uses: actions/checkout@v4
        with:
          ref: ancient-library-complete-book
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml weasyprint pypdf

      - name: Build audited Ancient Library v3
        run: python ancient-library/build_complete_ancient_library_v3_audited.py

      - name: Verify audited PDF and manifest
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          import json, os
          p='ancient-library/output-v2/The_Ancient_Library_Complete_Reading_Edition.pdf'
          m='ancient-library/output-v2/ancient_library_complete_manifest.json'
          a='ancient-library/output-v2/TEXTUAL_AUDIT.md'
          assert os.path.getsize(p) > 1_000_000, 'PDF unexpectedly small'
          r=PdfReader(p)
          data=json.load(open(m,encoding='utf-8'))
          print('PAGES',len(r.pages),'SIZE',os.path.getsize(p))
          print('SECTIONS',data['section_count'],'CHARS',data['character_count'])
          print('TIERS',data.get('audit_tier_counts'))
          print('AI_EXCLUDED',data.get('excluded_ai_marked_sources'))
          print('TRUE_MISSING',data.get('required_core_missing'))
          assert len(r.pages) > 500
          assert data['section_count'] > 100
          assert data.get('audit_version') == '3.0'
          assert not data['required_core_missing'], data['required_core_missing']
          assert os.path.getsize(a) > 500
          # No retained section may contain a strong self-declared AI translation marker.
          markers=('translated into english via chatgpt','translated by chatgpt','translation by chatgpt','chatgpt translation','translated using chatgpt')
          for s in data['sections']:
              hay=(s.get('text','')+' '+s.get('provenance','')+' '+s.get('notes','')).lower()
              assert not any(x in hay for x in markers), s.get('source')
          PY

      - name: Upload audited edition
        uses: actions/upload-artifact@v4
        with:
          name: ancient-library-audited-v3
          path: |
            ancient-library/output-v2/The_Ancient_Library_Complete_Reading_Edition.pdf
            ancient-library/output-v2/SOURCE_COVERAGE.md
            ancient-library/output-v2/TEXTUAL_AUDIT.md
            ancient-library/output-v2/ancient_library_complete_manifest.json
          retention-days: 30

      - name: Commit audited edition to research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ancient-library/output-v2
          git commit -m 'Build audited Ancient Library v3 reading edition' || exit 0
          git push origin HEAD:ancient-library-complete-book
