name: Release 94 Ancient Library Preflight

on:
  push:
    branches: [release94-ancient-library]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install web dependencies
        run: npm install
      - name: Build production Hobah with Ancient Library
        run: npm run build
      - name: Verify Ancient Library corpus and release assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('dist/ancient-library.json')
          data=json.loads(p.read_text())
          count=len(data.get('sections',[]))
          chars=int(data.get('total_characters') or sum(int(x.get('chars',0)) for x in data.get('sections',[])))
          assert count >= 180, count
          assert chars >= 10_000_000, chars
          assert Path('dist/release94-ancient-library.js').is_file()
          assert Path('dist/release94-ancient-library.css').is_file()
          html=Path('dist/index.html').read_text()
          assert 'release94-ancient-library.js' in html
          assert 'release94-ancient-library.css' in html
          print(f'Ancient Library preflight: {count} sections / {chars:,} characters')
          PY
      - name: Install native dependencies
        working-directory: native-ios
        run: npm install
      - name: Prepare native offline bundle
        working-directory: native-ios
        run: npm run prepare:web
      - name: Bundle native bridge
        working-directory: native-ios
        run: npm run build:bridge
      - name: Verify native bundle and run doctor
        working-directory: native-ios
        run: |
          test -f www/ancient-library.json
          test -f www/release94-ancient-library.js
          test -f www/release94-ancient-library.css
          npm run doctor
