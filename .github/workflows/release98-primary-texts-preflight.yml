name: Release 98 Primary Texts Preflight

on:
  push:
    branches: [release98-primary-texts-classical-nav]
  pull_request:
    branches: [main]
    paths:
      - 'release98-primary-texts-postbuild.js'
      - 'package.json'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install
      - name: Build production Hobah
        run: npm run build
      - name: Verify Release 98 library rules
        run: |
          node --check release98-primary-texts-postbuild.js
          node --check dist/release94-ancient-library.js
          node --check dist/app.js
          node - <<'NODE'
          const fs=require('fs');
          const lib=fs.readFileSync('dist/release94-ancient-library.js','utf8');
          const css=fs.readFileSync('dist/release97-ancient-library.css','utf8');
          const app=fs.readFileSync('dist/app.js','utf8');
          const html=fs.readFileSync('dist/index.html','utf8');
          const checks=[
            [lib.includes("const LIB_VERSION='98'"),'Release 98 library runtime'],
            [lib.includes('isModernEditorialSection'),'modern/editorial section exclusion'],
            [lib.includes('collection profile'),'collection-profile exclusion'],
            [lib.includes('william n\\.?\\s*guthrie'),'1920s introduction exclusion'],
            [lib.includes('specificWorkTitle'),'specific work title mapper'],
            [lib.includes('Eusebius — Ecclesiastical History'),'Eusebius title expansion'],
            [lib.includes('Athanasius — Festal Letter 39'),'Athanasius title expansion'],
            [lib.includes('drawer.dataset.activeShelf=state.tab'),'shelf palette state'],
            [css.includes('data-active-shelf="scripture"'),'green/cream Scripture palette'],
            [css.includes('data-active-shelf="ancient"'),'tan Ancient Library palette'],
            [app.includes("const V='98';"),'app cache version'],
            [html.includes('v=98'),'Release 98 asset cache bust']
          ];
          for(const [ok,name] of checks){if(!ok)throw new Error('Missing '+name);console.log('OK',name)}
          NODE
      - name: Install native dependencies
        working-directory: native-ios
        run: npm install
      - name: Prepare native offline bundle
        working-directory: native-ios
        run: npm run prepare:web
      - name: Bundle native bridge
        working-directory: native-ios
        run: npm run build:bridge
      - name: Verify native bundle and doctor
        working-directory: native-ios
        run: npm run doctor
