name: Validate Hobah Release 80 iOS

on:
  push:
    branches: [release80-proven-speech-engine]
    paths:
      - 'native-ios/**'
      - '.github/workflows/ios-release80-validation.yml'
      - 'package.json'
      - 'release*.js'

permissions:
  contents: write

jobs:
  ios-release80:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          test -n "$XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Build Hobah web release
        run: |
          npm install
          npm run build
      - name: Install native dependencies
        working-directory: native-ios
        run: npm install
      - name: Prepare and sync native project
        working-directory: native-ios
        run: |
          npm run prepare:web
          npm run build:bridge
          node scripts/init-ios.mjs
          npx cap sync ios
          node scripts/post-ios.mjs
          npm run doctor
      - name: Verify Release 80 speech engine integration
        working-directory: native-ios
        shell: bash
        run: |
          set -euo pipefail
          grep -R "SpeechRecognitionPlugin" ios/App -n | head
          grep -R "voiceChat" node_modules/@capgo/capacitor-speech-recognition/ios/Sources/SpeechRecognitionPlugin/SpeechRecognitionPlugin.swift
          grep -R "setVoiceProcessingEnabled(true)" node_modules/@capgo/capacitor-speech-recognition/ios/Sources/SpeechRecognitionPlugin/SpeechRecognitionPlugin.swift
          grep -R "@capgo/capacitor-speech-recognition" package.json
      - name: Build iPhone and iPad Simulator app
        working-directory: native-ios
        run: |
          set -euo pipefail
          rm -rf ios/build
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
          fi
          test -d ios/build/Build/Products/Debug-iphonesimulator/App.app
      - name: Archive compiled app
        uses: actions/upload-artifact@v4
        with:
          name: hobah-release80-simulator-app
          path: native-ios/ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
      - name: Publish Release 80 validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version 2>/dev/null | tr '\n' ' ' || true)"
          BODY=$(cat <<EOF
          # Hobah Release 80 Validation

          - status: ${JOB_STATUS}
          - source_commit: ${GITHUB_SHA}
          - run_id: ${GITHUB_RUN_ID}
          - xcode: ${XCODE_VERSION:-unavailable}
          - checked_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - speech_engine: @capgo/capacitor-speech-recognition 8.1.0
          - aec: playAndRecord + voiceChat + input/output voice processing
          EOF
          )
          ENCODED="$(printf '%s' "$BODY" | base64)"
          REPO="${GITHUB_REPOSITORY}"
          STATUS_BRANCH="ci-release80-status"
          if ! gh api "repos/${REPO}/git/ref/heads/${STATUS_BRANCH}" >/dev/null 2>&1; then
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/heads/${STATUS_BRANCH}" -f sha="${GITHUB_SHA}" >/dev/null
          fi
          OLD_SHA="$(gh api "repos/${REPO}/contents/release80-status.md?ref=${STATUS_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$OLD_SHA" ]; then
            gh api -X PUT "repos/${REPO}/contents/release80-status.md" -f message="Update Release 80 validation status" -f content="$ENCODED" -f branch="$STATUS_BRANCH" -f sha="$OLD_SHA" >/dev/null
          else
            gh api -X PUT "repos/${REPO}/contents/release80-status.md" -f message="Publish Release 80 validation status" -f content="$ENCODED" -f branch="$STATUS_BRANCH" >/dev/null
          fi
