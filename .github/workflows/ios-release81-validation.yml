name: Validate Hobah Release 81 Listen

on:
  push:
    branches: [release81-listen-rebuild]
    paths:
      - 'release81-listen-*.js'
      - 'package.json'
      - 'native-ios/**'
      - '.github/workflows/ios-release81-validation.yml'

jobs:
  listen-release81:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          test -n "$XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Build Hobah web runtime
        run: |
          npm install
          npm run build
          node --check dist/app.js
      - name: Verify Listen V2 behavior contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const HOBAH_LISTEN_V2=true" dist/app.js
          grep -F "$('#listenChapter').onclick=()=>openListenPanelForChapter(b,c);" dist/app.js
          if grep -F "$('#listenChapter').onclick=()=>startNarrationFromChapter(b,c);" dist/app.js; then exit 1; fi
          grep -F "Ready • press play or turn on Voice Commands" dist/app.js
          grep -F "state.audio.voiceWanted" dist/app.js
          grep -F "function suspendRecognitionForStudy(){" dist/app.js
          grep -F "function resumeRecognitionAfterStudy(){" dist/app.js
      - name: Install and prepare native app
        working-directory: native-ios
        run: |
          npm install
          npm run prepare:web
          npm run build:bridge
          node scripts/init-ios.mjs
          npx cap sync ios
          node scripts/post-ios.mjs
          npm run doctor
      - name: Verify native voice engine contract
        working-directory: native-ios
        shell: bash
        run: |
          set -euo pipefail
          grep -F "continuousPTT:true" src/native-audio.js
          grep -F "setPTTState({held:true})" src/native-audio.js
          grep -F "readyForNextSession" src/native-audio.js
          grep -F "HOBAH_LISTEN_V2=true" www/app.js
          grep -F "Listen state machine preserved intact" scripts/patch-native-voice.mjs
      - name: Build iPhone and iPad Simulator app
        working-directory: native-ios
        run: |
          set -euo pipefail
          rm -rf ios/build
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
          fi
          test -d ios/build/Build/Products/Debug-iphonesimulator/App.app
      - name: Archive compiled app
        uses: actions/upload-artifact@v4
        with:
          name: hobah-release81-listen-simulator
          path: native-ios/ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
