name: Upload Hobah to TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'App version shown in App Store Connect'
        required: true
        default: '1.0.0'
  push:
    branches: [main]
    paths:
      - 'native-ios/testflight-trigger.txt'

permissions:
  contents: write

concurrency:
  group: hobah-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      BUNDLE_ID: com.hobah.bible
      APP_NAME: Hobah
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Apple signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_TEAM_ID KEY_ID ISSUER_ID API_P8 CERT_P12 CERT_PASSWORD PROFILE_B64; do
            if [ -z "${!name:-}" ]; then echo "Missing required secret: $name" >&2; missing=1; fi
          done
          test "$missing" -eq 0

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then
            echo 'Xcode 26 is not installed on this runner.' >&2
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          if [[ ! "$XCODE_VERSION" =~ ^Xcode[[:space:]]26([[:space:].]|$) ]]; then
            echo "Expected Xcode 26, got: $XCODE_VERSION" >&2
            exit 1
          fi

      - name: Install Apple distribution certificate, API key and App Store profile
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/hobah-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/hobah-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/hobah-app-store.mobileprovision"
          API_DIR="$HOME/.appstoreconnect/private_keys"
          API_PATH="$API_DIR/AuthKey_${KEY_ID}.p8"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$API_DIR" "$PROFILE_DIR"
          printf '%s' "$CERT_P12" | base64 --decode > "$CERT_PATH"
          printf '%s' "$API_P8" | base64 --decode > "$API_PATH"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          chmod 600 "$API_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          echo "Installed provisioning profile: $PROFILE_NAME"
          echo "Provisioning app identifier: $PROFILE_APP_ID"
          echo "ASC_KEY_PATH=$API_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Build Hobah web release
        run: |
          npm install
          npm run build

      - name: Generate native iOS project
        working-directory: native-ios
        run: |
          npm install
          npm run prepare:web
          npm run build:bridge
          node scripts/init-ios.mjs
          npx cap sync ios
          node scripts/post-ios.mjs
          npm run doctor

      - name: Configure App target for App Store signing
        working-directory: native-ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          PBX='ios/App/App.xcodeproj/project.pbxproj'
          python3 - "$PBX" "$APPLE_TEAM_ID" "$PROFILE_NAME" <<'PY'
          import re, sys
          p, team, profile = sys.argv[1:]
          s=open(p).read()
          pattern=r'(buildSettings = \{.*?PRODUCT_BUNDLE_IDENTIFIER = [^;]+;.*?\n\s*\};)'
          def patch(m):
              block=m.group(1)
              if 'PRODUCT_BUNDLE_IDENTIFIER' not in block:
                  return block
              block=re.sub(r'\n\s*(CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|PROVISIONING_PROFILE)\s*=\s*[^;]+;','',block)
              insert=(f'\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
                      f'\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";'
                      f'\n\t\t\t\tDEVELOPMENT_TEAM = {team};'
                      f'\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile}";')
              return block.replace('\n\t\t\t};',insert+'\n\t\t\t};')
          out=re.sub(pattern,patch,s,flags=re.S)
          if out==s:
              raise SystemExit('Could not patch App target signing settings')
          open(p,'w').write(out)
          PY
          grep -n -E 'CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM' "$PBX" | tail -20

      - name: Archive signed Hobah app
        working-directory: native-ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version || '1.0.0' }}
        run: |
          set -euo pipefail
          rm -rf ios/archive ios/export
          mkdir -p ios/archive ios/export
          COMMON=(
            -scheme App
            -configuration Release
            -destination 'generic/platform=iOS'
            -archivePath ios/archive/Hobah.xcarchive
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"
            MARKETING_VERSION="$MARKETING_VERSION"
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
            archive
          )
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace "${COMMON[@]}"
          else
            xcodebuild -project ios/App/App.xcodeproj "${COMMON[@]}"
          fi
          test -d ios/archive/Hobah.xcarchive

      - name: Validate signed archive for App Store
        working-directory: native-ios
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version || '1.0.0' }}
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find ios/archive/Hobah.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          INFO="$APP_PATH/Info.plist"
          test -f "$INFO"

          value(){ /usr/libexec/PlistBuddy -c "Print :$1" "$INFO"; }
          test "$(value CFBundleIdentifier)" = "$BUNDLE_ID"
          test "$(value CFBundleShortVersionString)" = "$MARKETING_VERSION"
          test "$(value CFBundleVersion)" = "$GITHUB_RUN_NUMBER"
          test "$(value MinimumOSVersion)" = "15.0"
          test "$(value UIDeviceFamily:0)" = "1"
          test "$(value UIDeviceFamily:1)" = "2"
          test "$(value UIBackgroundModes:0)" = "audio"
          test "$(value ITSAppUsesNonExemptEncryption)" = "false"
          test -n "$(value NSMicrophoneUsageDescription)"
          test -n "$(value NSSpeechRecognitionUsageDescription)"
          if /usr/libexec/PlistBuddy -c 'Print :UIApplicationExitsOnSuspend' "$INFO" >/dev/null 2>&1; then
            echo 'UIApplicationExitsOnSuspend must not be present in the shipping app.' >&2
            exit 1
          fi

          test -f "$APP_PATH/Frameworks/Capacitor.framework/PrivacyInfo.xcprivacy"
          test -f "$APP_PATH/Frameworks/Cordova.framework/PrivacyInfo.xcprivacy"
          plutil -lint "$APP_PATH/Frameworks/Capacitor.framework/PrivacyInfo.xcprivacy"
          plutil -lint "$APP_PATH/Frameworks/Cordova.framework/PrivacyInfo.xcprivacy"

          test -f "$APP_PATH/public/privacy.html"
          test -f "$APP_PATH/public/support.html"
          GIANTS="$APP_PATH/public/ancient-works/hobah-book-of-giants.json"
          test -f "$GIANTS"
          python3 - "$GIANTS" <<'PY'
          import json,sys
          p=sys.argv[1]
          d=json.load(open(p))
          assert d.get('id')=='hobah-book-of-giants'
          assert d.get('collection')=='ancient'
          assert len(d.get('chapters') or [])==13
          note=((d.get('translation') or {}).get('license_note') or '').lower()
          assert 'public domain' in note or 'cc0' in note
          print('Book of Giants archive check passed: 13 Ancient Library fragment sections')
          PY

          if grep -RIlE 'sk-[A-Za-z0-9_-]{20,}' "$APP_PATH/public" >/dev/null 2>&1; then
            echo 'Potential API secret detected in the public app bundle.' >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "App Store archive preflight passed: $APP_PATH"

      - name: Export App Store IPA
        working-directory: native-ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath ios/archive/Hobah.xcarchive \
            -exportPath ios/export \
            -exportOptionsPlist ios/ExportOptions.plist
          IPA="$(find "$PWD/ios/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          test -f "$IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Upload IPA to TestFlight
        id: app_store_upload
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/app-store-upload.log"
          : > "$LOG"
          test -f "$IPA_PATH" || { echo "IPA missing at $IPA_PATH" | tee "$LOG"; exit 1; }
          echo "Uploading $IPA_PATH to App Store Connect…"
          set +e
          if xcrun altool --help >/dev/null 2>&1; then
            xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" 2>&1 | tee "$LOG"
            STATUS=${PIPESTATUS[0]}
          else
            xcrun iTMSTransporter -m upload -assetFile "$IPA_PATH" -apiKey "$KEY_ID" -apiIssuer "$ISSUER_ID" -v informational 2>&1 | tee "$LOG"
            STATUS=${PIPESTATUS[0]}
          fi
          set -e
          echo "upload_exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Archive signed IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hobah-testflight-ipa
          path: native-ios/ios/export/*.ipa
          if-no-files-found: warn

      - name: Publish TestFlight status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS_FILE="$RUNNER_TEMP/testflight-status.md"
          {
            echo '# Hobah TestFlight Status'
            echo
            echo "- status: ${JOB_STATUS}"
            echo "- source_commit: ${GITHUB_SHA}"
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- bundle_id: ${BUNDLE_ID}"
            echo "- checked_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [ -f "$RUNNER_TEMP/app-store-upload.log" ]; then
              echo
              echo '## App Store Connect upload output'
              echo
              tail -n 180 "$RUNNER_TEMP/app-store-upload.log"
            fi
          } > "$STATUS_FILE"
          ENCODED="$(base64 < "$STATUS_FILE")"
          REPO="${GITHUB_REPOSITORY}"
          STATUS_BRANCH="ci-testflight-status"
          if ! gh api "repos/${REPO}/git/ref/heads/${STATUS_BRANCH}" >/dev/null 2>&1; then
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/heads/${STATUS_BRANCH}" -f sha="${GITHUB_SHA}" >/dev/null
          fi
          OLD_SHA="$(gh api "repos/${REPO}/contents/testflight-status.md?ref=${STATUS_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$OLD_SHA" ]; then
            gh api -X PUT "repos/${REPO}/contents/testflight-status.md" \
              -f message="Update Hobah TestFlight status" \
              -f content="$ENCODED" \
              -f branch="$STATUS_BRANCH" \
              -f sha="$OLD_SHA" >/dev/null
          else
            gh api -X PUT "repos/${REPO}/contents/testflight-status.md" \
              -f message="Publish Hobah TestFlight status" \
              -f content="$ENCODED" \
              -f branch="$STATUS_BRANCH" >/dev/null
          fi
