name: Build Complete Ancient Library V2

# Final manual build trigger: 2026-08-23
on:
  push:
    branches: [ancient-library-complete-book]
    paths:
      - 'ancient-library/build_complete_ancient_library_v2.py'
      - '.github/workflows/build-complete-ancient-library-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ancient-library/build_complete_ancient_library_v2.py'
      - '.github/workflows/build-complete-ancient-library-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ancient-library-complete-book
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml weasyprint pypdf

      - name: Build The Ancient Library
        run: python ancient-library/build_complete_ancient_library_v2.py

      - name: Verify PDF and core corpus
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          import json, os
          p='ancient-library/output-v2/The_Ancient_Library_Complete_Reading_Edition.pdf'
          m='ancient-library/output-v2/ancient_library_complete_manifest.json'
          assert os.path.getsize(p) > 1_000_000
          r=PdfReader(p)
          print('PAGES',len(r.pages),'SIZE',os.path.getsize(p))
          assert len(r.pages) > 500
          data=json.load(open(m,encoding='utf-8'))
          print('SECTIONS',data['section_count'],'CHARS',data['character_count'])
          assert data['section_count'] > 100
          assert not data['required_core_missing'], data['required_core_missing']
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ancient-library-complete-v2
          path: |
            ancient-library/output-v2/The_Ancient_Library_Complete_Reading_Edition.pdf
            ancient-library/output-v2/SOURCE_COVERAGE.md
            ancient-library/output-v2/ancient_library_complete_manifest.json
          retention-days: 30

      - name: Commit generated edition to research branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ancient-library/output-v2
          git commit -m 'Build complete Ancient Library v2 reading edition' || exit 0
          git push origin HEAD:ancient-library-complete-book
