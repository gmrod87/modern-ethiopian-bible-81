name: Release 102 Ancient Reader Preflight

on:
  push:
    branches: [release102-ancient-reader-polish]
  pull_request:
    branches: [main]
    paths:
      - 'release102-ancient-reader-polish-postbuild.js'
      - 'package.json'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install
      - name: Build production Hobah
        run: npm run build
      - name: Verify Release 102 Ancient reader
        run: |
          node --check release102-ancient-reader-polish-postbuild.js
          node --check dist/release94-ancient-library.js
          node --check dist/app.js
          node - <<'NODE'
          const fs=require('fs');
          const lib=fs.readFileSync('dist/release94-ancient-library.js','utf8');
          const css=fs.readFileSync('dist/release97-ancient-library.css','utf8');
          const app=fs.readFileSync('dist/app.js','utf8');
          const checks=[
            [lib.includes("const LIB_VERSION='102'"),'Release 102 runtime'],
            [lib.includes('visiblePrimaryText'),'visible primary-text cleaner'],
            [lib.includes('historicalWorkMeta'),'author/date metadata'],
            [lib.includes('Ignatius of Antioch'),'Ignatius metadata'],
            [lib.includes('Clement of Rome'),'Clement metadata'],
            [lib.includes("addEventListener('pointerup'"),'first-touch shelf activation'],
            [lib.includes('ancientWorkMeta'),'reader author/date line'],
            [css.includes('#ancientReaderText.ancientChapterText'),'reader text buffer'],
            [css.includes('touch-action:manipulation'),'touch target styling'],
            [app.includes("const V='102';"),'app cache version']
          ];
          for(const [ok,name] of checks){if(!ok)throw new Error('Missing '+name);console.log('OK',name)}
          NODE
      - name: Install native dependencies
        working-directory: native-ios
        run: npm install
      - name: Prepare native offline bundle
        working-directory: native-ios
        run: npm run prepare:web
      - name: Bundle native bridge
        working-directory: native-ios
        run: npm run build:bridge
      - name: Verify native bundle and doctor
        working-directory: native-ios
        run: npm run doctor
