name: Validate Hobah Release 83

on:
  push:
    branches: [release83-study-handoff]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-release83:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install web dependencies
        run: npm install
      - name: Build Release 83
        run: npm run build
      - name: Verify generated web handoff
        run: |
          grep -F "const V='83';" dist/app.js
          grep -F "requestVoiceExplanation" dist/app.js
          grep -F "window.HobahNativeAudio.play({text:part,mode:'normal',title:'Study AI'" dist/app.js
          grep -F "state.studyHistory.push({role:'user',text:displayQuestion},{role:'assistant',text:ans})" dist/app.js
          ! grep -F "try{ans=await realtimeStudyExplain(ref)" dist/app.js
      - name: Install native dependencies
        working-directory: native-ios
        run: npm install
      - name: Prepare native web bundle
        working-directory: native-ios
        run: npm run prepare:web
      - name: Verify native Study isolation
        run: |
          grep -F "!state.audio.studyBusy)advanceNarration()" native-ios/www/app.js
          grep -F "window.HobahNativeAudio||state.audio.studyBusy" native-ios/www/app.js
          grep -F "window.HobahNativeAudio.play({text:part,mode:'normal',title:'Study AI'" native-ios/www/app.js
      - name: Build native bridge
        working-directory: native-ios
        run: npm run build:bridge
      - name: Validate native bundle
        working-directory: native-ios
        run: npm run doctor
      - name: Publish validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS_BRANCH="ci-release83-status"
          STATUS_FILE="$RUNNER_TEMP/release83-status.md"
          {
            echo '# Hobah Release 83 Validation'
            echo
            echo "- status: ${JOB_STATUS}"
            echo "- source_commit: ${GITHUB_SHA}"
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- checked_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$STATUS_FILE"
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${STATUS_BRANCH}" >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${STATUS_BRANCH}" -f sha="${GITHUB_SHA}" >/dev/null
          fi
          OLD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/release83-status.md?ref=${STATUS_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          ENCODED="$(base64 < "$STATUS_FILE")"
          if [ -n "$OLD_SHA" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/release83-status.md" -f message="Update Release 83 validation status" -f content="$ENCODED" -f branch="$STATUS_BRANCH" -f sha="$OLD_SHA" >/dev/null
          else
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/release83-status.md" -f message="Publish Release 83 validation status" -f content="$ENCODED" -f branch="$STATUS_BRANCH" >/dev/null
          fi
