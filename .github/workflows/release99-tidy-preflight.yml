name: Release 99 Ancient Titles and Search Preflight

on:
  push:
    branches: [release99-tidy-ancient-titles-search]
  pull_request:
    branches: [main]
    paths:
      - 'release99-library-titles-search-postbuild.js'
      - 'package.json'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install
      - name: Build production Hobah
        run: npm run build
      - name: Verify Release 99 title and search cleanup
        run: |
          node --check release99-library-titles-search-postbuild.js
          node --check dist/release94-ancient-library.js
          node --check dist/app.js
          node - <<'NODE'
          const fs=require('fs');
          const lib=fs.readFileSync('dist/release94-ancient-library.js','utf8');
          const css=fs.readFileSync('dist/release97-ancient-library.css','utf8');
          const app=fs.readFileSync('dist/app.js','utf8');
          const html=fs.readFileSync('dist/index.html','utf8');
          const checks=[
            [lib.includes("const LIB_VERSION='99'"),'Release 99 library runtime'],
            [lib.includes('finalWorkTitle'),'human-readable title resolver'],
            [lib.includes("return'First Book of Adam and Eve'"),'FBE Book 1 expansion'],
            [lib.includes('Such was the condition of the Jews')||lib.toLowerCase().includes('such was the condition of the jews'),'Eusebius content signature'],
            [lib.includes('⌕ Find in text'),'single Find in text control'],
            [lib.includes('Find a word or phrase…'),'compact search input'],
            [!lib.includes('id="ancientReaderFindBtn"'),'old brown Find submit removed'],
            [css.includes('.ancientInlineFind[hidden]'),'hidden search row enforced'],
            [css.includes('.ancientReaderMatchStatus:empty'),'empty match status hidden'],
            [app.includes("const V='99';"),'app cache version'],
            [html.includes('v=99'),'Release 99 asset cache bust']
          ];
          for(const [ok,name] of checks){if(!ok)throw new Error('Missing '+name);console.log('OK',name)}
          NODE
      - name: Install native dependencies
        working-directory: native-ios
        run: npm install
      - name: Prepare native offline bundle
        working-directory: native-ios
        run: npm run prepare:web
      - name: Bundle native bridge
        working-directory: native-ios
        run: npm run build:bridge
      - name: Verify native bundle and doctor
        working-directory: native-ios
        run: npm run doctor
