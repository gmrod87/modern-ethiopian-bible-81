name: Validate Hobah Release 86

on:
  push:
    branches: [release86-settings-haptics]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install
      - name: Build Release 86
        run: npm run build
      - name: Verify dedicated Settings runtime
        run: |
          grep -F "const V='86';" dist/app.js
          grep -F "ensureSettingsDialog" dist/app.js
          grep -F "window.HobahSettings" dist/app.js
          grep -F "hobah:open-settings" dist/app.js
          grep -F "bottomSettings" dist/index.html
          ! grep -F 'id="audioVoiceToggle"' dist/index.html
      - name: Install native dependencies
        working-directory: native-ios
        run: npm install
      - name: Prepare native web bundle
        working-directory: native-ios
        run: npm run prepare:web
      - name: Build native bridges
        working-directory: native-ios
        run: npm run build:bridge
      - name: Verify native Settings and haptics
        run: |
          grep -F "const V='86';" native-ios/www/app.js
          grep -F "window.HobahSettings" native-ios/www/app.js
          grep -F "pointerdown" native-ios/www/native-bridge.js
          grep -F "hobah:open-settings" native-ios/www/native-bridge.js
          grep -F "bottomSettings" native-ios/www/native-bridge.js
          grep -F "ImpactStyle.Medium" native-ios/src/native-bridge.js
          ! grep -F 'id="audioVoiceToggle"' native-ios/www/index.html
      - name: Validate native bundle
        working-directory: native-ios
        run: npm run doctor
      - name: Publish validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS_BRANCH="ci-release86-status"
          STATUS_FILE="$RUNNER_TEMP/release86-status.md"
          {
            echo '# Hobah Release 86 Validation'
            echo
            echo "- status: ${JOB_STATUS}"
            echo "- source_commit: ${GITHUB_SHA}"
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- checked_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$STATUS_FILE"
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${STATUS_BRANCH}" >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${STATUS_BRANCH}" -f sha="${GITHUB_SHA}" >/dev/null
          fi
          OLD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/release86-status.md?ref=${STATUS_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          ENCODED="$(base64 < "$STATUS_FILE")"
          if [ -n "$OLD_SHA" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/release86-status.md" -f message="Update Release 86 validation status" -f content="$ENCODED" -f branch="$STATUS_BRANCH" -f sha="$OLD_SHA" >/dev/null
          else
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/release86-status.md" -f message="Publish Release 86 validation status" -f content="$ENCODED" -f branch="$STATUS_BRANCH" >/dev/null
          fi
