name: Build Hobah iOS Simulator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native-ios/**'
      - '.github/workflows/ios-simulator-build.yml'
      - 'package.json'
      - 'release75-appstore-ready.js'

permissions:
  contents: write

concurrency:
  group: hobah-ios-simulator-main
  cancel-in-progress: true

jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then
            echo 'Xcode 26 is not installed on this runner.' >&2
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          if [[ ! "$XCODE_VERSION" =~ ^Xcode[[:space:]]26([[:space:].]|$) ]]; then
            echo "Expected Xcode 26, got: $XCODE_VERSION" >&2
            exit 1
          fi

      - name: Install Hobah web dependencies
        run: npm install

      - name: Build Hobah web release
        run: npm run build

      - name: Install Capacitor dependencies
        working-directory: native-ios
        run: npm install

      - name: Prepare native web bundle and bridges
        working-directory: native-ios
        run: |
          npm run prepare:web
          npm run build:bridge

      - name: Generate and sync Xcode project
        working-directory: native-ios
        run: |
          node scripts/init-ios.mjs
          npx cap sync ios
          node scripts/post-ios.mjs
          npm run doctor

      - name: Build unsigned iPhone/iPad Simulator app
        working-directory: native-ios
        run: |
          set -euo pipefail
          rm -rf ios/build
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath ios/build \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath ios/build \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi
          test -d ios/build/Build/Products/Debug-iphonesimulator/App.app

      - name: Launch smoke test on iPhone Simulator
        working-directory: native-ios
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/ios/build/Build/Products/Debug-iphonesimulator/App.app"
          SHOT="$RUNNER_TEMP/hobah-home-smoke.png"
          UDID="$(python3 - <<'PY'
          import json,subprocess
          raw=subprocess.check_output(['xcrun','simctl','list','devices','available','-j'])
          data=json.loads(raw)
          candidates=[]
          for runtime,devices in data.get('devices',{}).items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and str(d.get('name','')).startswith('iPhone'):
                      candidates.append((runtime,d.get('name',''),d.get('udid','')))
          candidates.sort(reverse=True)
          if not candidates:
              raise SystemExit('No available iPhone simulator')
          print(candidates[0][2])
          PY
          )"
          test -n "$UDID"
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.hobah.bible
          sleep 6
          xcrun simctl io "$UDID" screenshot "$SHOT"
          test -s "$SHOT"
          python3 - "$SHOT" <<'PY'
          import os,sys
          p=sys.argv[1]
          if os.path.getsize(p)<25000:
              raise SystemExit('Simulator screenshot is unexpectedly small')
          print('iPhone launch smoke screenshot bytes:',os.path.getsize(p))
          PY
          echo "SMOKE_SCREENSHOT=$SHOT" >> "$GITHUB_ENV"

      - name: Archive launch smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: hobah-ios-launch-smoke
          path: ${{ env.SMOKE_SCREENSHOT }}
          if-no-files-found: error

      - name: Archive compiled Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: hobah-ios-simulator-app
          path: native-ios/ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error

      - name: Archive generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: hobah-ios-xcode-project
          path: |
            native-ios/ios/App
            !native-ios/ios/build
          if-no-files-found: error

      - name: Publish compiler status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version 2>/dev/null | tr '\n' ' ' || true)"
          BODY=$(cat <<EOF
          # Hobah iOS Compiler Status

          - status: ${JOB_STATUS}
          - source_commit: ${GITHUB_SHA}
          - run_id: ${GITHUB_RUN_ID}
          - xcode: ${XCODE_VERSION:-unavailable}
          - checked_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - native_voice_study: enabled
          - simulator_target: iPhone/iPad
          - launch_smoke: automated iPhone simulator launch + screenshot
          EOF
          )
          ENCODED="$(printf '%s' "$BODY" | base64)"
          REPO="${GITHUB_REPOSITORY}"
          STATUS_BRANCH="ci-ios-status"
          if ! gh api "repos/${REPO}/git/ref/heads/${STATUS_BRANCH}" >/dev/null 2>&1; then
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/heads/${STATUS_BRANCH}" -f sha="${GITHUB_SHA}" >/dev/null
          fi
          OLD_SHA="$(gh api "repos/${REPO}/contents/ios-simulator-status.md?ref=${STATUS_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$OLD_SHA" ]; then
            gh api -X PUT "repos/${REPO}/contents/ios-simulator-status.md" \
              -f message="Update Hobah iOS compiler status" \
              -f content="$ENCODED" \
              -f branch="$STATUS_BRANCH" \
              -f sha="$OLD_SHA" >/dev/null
          else
            gh api -X PUT "repos/${REPO}/contents/ios-simulator-status.md" \
              -f message="Publish Hobah iOS compiler status" \
              -f content="$ENCODED" \
              -f branch="$STATUS_BRANCH" >/dev/null
          fi
