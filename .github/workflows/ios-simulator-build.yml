name: Build Hobah iOS Simulator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native-ios/**'
      - '.github/workflows/ios-simulator-build.yml'
      - 'package.json'
      - 'release75-appstore-ready.js'

permissions:
  contents: read

concurrency:
  group: hobah-ios-simulator-main
  cancel-in-progress: true

jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then
            echo 'Xcode 26 is not installed on this runner.' >&2
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          if [[ ! "$XCODE_VERSION" =~ ^Xcode[[:space:]]26([[:space:].]|$) ]]; then
            echo "Expected Xcode 26, got: $XCODE_VERSION" >&2
            exit 1
          fi

      - name: Build Hobah web release
        run: |
          npm install
          npm run build

      - name: Generate native iOS project
        working-directory: native-ios
        run: |
          npm install
          npm run prepare:web
          npm run build:bridge
          node scripts/init-ios.mjs
          npx cap sync ios
          node scripts/post-ios.mjs
          npm run doctor

      - name: Build ad-hoc signed Simulator app
        working-directory: native-ios
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios/build
          COMMON=(
            -scheme App
            -configuration Debug
            -sdk iphonesimulator
            -destination 'generic/platform=iOS Simulator'
            -derivedDataPath ios/build
            CODE_SIGNING_ALLOWED=YES
            CODE_SIGNING_REQUIRED=YES
            CODE_SIGN_IDENTITY=-
            DEVELOPMENT_TEAM=
            PROVISIONING_PROFILE_SPECIFIER=
            build
          )
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace "${COMMON[@]}"
          else
            xcodebuild -project ios/App/App.xcodeproj "${COMMON[@]}"
          fi
          APP="$PWD/ios/build/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | tail -20

      - name: Launch smoke test on iPhone and iPad Simulators
        working-directory: native-ios
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/ios/build/Build/Products/Debug-iphonesimulator/App.app"
          OUT="$RUNNER_TEMP/hobah-simulator-smoke"
          mkdir -p "$OUT"
          python3 - "$APP" "$OUT" <<'PY'
          import json, os, re, subprocess, sys, time
          app, out_dir = sys.argv[1:]

          def run(args, timeout=60, check=False):
              try:
                  p=subprocess.run(args,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                  code,out,err=p.returncode,p.stdout,p.stderr
              except subprocess.TimeoutExpired as e:
                  code=124
                  out=e.stdout.decode() if isinstance(e.stdout,bytes) else (e.stdout or '')
                  err=e.stderr.decode() if isinstance(e.stderr,bytes) else (e.stderr or '')
              if check and code:
                  raise SystemExit(f"command failed ({code}): {' '.join(args)}\nstdout:\n{out[-1800:]}\nstderr:\n{err[-1800:]}")
              return code,out,err

          def runtime_key(runtime):
              m=re.search(r'iOS-(\d+)(?:-(\d+))?(?:-(\d+))?$',runtime)
              return tuple(int(x or 0) for x in m.groups()) if m else (0,0,0)

          _,raw,_=run(['xcrun','simctl','list','devices','available','-j'],30,True)
          data=json.loads(raw)
          all_devices=[]
          for runtime,devices in data.get('devices',{}).items():
              if 'iOS' not in runtime: continue
              for d in devices:
                  if d.get('isAvailable'):
                      all_devices.append((runtime_key(runtime),runtime,d.get('name',''),d.get('udid','')))
          all_devices.sort(reverse=True)

          targets=[]
          for kind,prefix in [('iphone','iPhone'),('ipad','iPad')]:
              found=next((x for x in all_devices if x[2].startswith(prefix)),None)
              if not found: raise SystemExit(f'No available {kind} simulator')
              targets.append((kind,*found))

          for kind,_,runtime,name,udid in targets:
              print(f'Using {kind}: {runtime} {name} {udid}')
              run(['xcrun','simctl','shutdown',udid],20)
              code,stdout,stderr=run(['xcrun','simctl','boot',udid],60)
              if code not in (0,149):
                  print('boot returned',code,(stderr or stdout)[-800:])
              run(['xcrun','simctl','bootstatus',udid,'-b'],180,True)
              run(['xcrun','simctl','uninstall',udid,'com.hobah.bible'],30)
              run(['xcrun','simctl','install',udid,app],60,True)
              code,stdout,stderr=run(['xcrun','simctl','launch','--terminate-running-process',udid,'com.hobah.bible'],30)
              if code:
                  raise SystemExit(f'Hobah failed to launch on {kind}: {(stderr or stdout)[-1800:]}')
              print('Launch:',stdout.strip())
              time.sleep(10 if kind=='ipad' else 7)
              shot=os.path.join(out_dir,f'hobah-{kind}-smoke.png')
              run(['xcrun','simctl','io',udid,'screenshot',shot],30,True)
              if not os.path.isfile(shot) or os.path.getsize(shot)<25000:
                  raise SystemExit(f'{kind} screenshot missing or unexpectedly small')
              print(f'{kind} screenshot bytes:',os.path.getsize(shot))
              run(['xcrun','simctl','terminate',udid,'com.hobah.bible'],20)
          PY
          echo "SMOKE_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Archive launch smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: hobah-ios-launch-smoke
          path: ${{ env.SMOKE_DIR }}/*.png
          if-no-files-found: error

      - name: Archive compiled Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: hobah-ios-simulator-app
          path: native-ios/ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
