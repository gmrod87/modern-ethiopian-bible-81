name: Build Hobah iOS Simulator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native-ios/**'
      - '.github/workflows/ios-simulator-build.yml'
      - 'package.json'
      - 'release75-appstore-ready.js'

permissions:
  contents: write

concurrency:
  group: hobah-ios-simulator-main
  cancel-in-progress: true

jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then
            echo 'Xcode 26 is not installed on this runner.' >&2
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          if [[ ! "$XCODE_VERSION" =~ ^Xcode[[:space:]]26([[:space:].]|$) ]]; then
            echo "Expected Xcode 26, got: $XCODE_VERSION" >&2
            exit 1
          fi

      - name: Install Hobah web dependencies
        run: npm install

      - name: Build Hobah web release
        run: npm run build

      - name: Install Capacitor dependencies
        working-directory: native-ios
        run: npm install

      - name: Prepare native web bundle and bridges
        working-directory: native-ios
        run: |
          npm run prepare:web
          npm run build:bridge

      - name: Generate and sync Xcode project
        working-directory: native-ios
        run: |
          node scripts/init-ios.mjs
          npx cap sync ios
          node scripts/post-ios.mjs
          npm run doctor

      - name: Build unsigned iPhone/iPad Simulator app
        working-directory: native-ios
        run: |
          set -euo pipefail
          rm -rf ios/build
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath ios/build \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath ios/build \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi
          test -d ios/build/Build/Products/Debug-iphonesimulator/App.app

      - name: Launch smoke test on iPhone Simulator
        working-directory: native-ios
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/ios/build/Build/Products/Debug-iphonesimulator/App.app"
          SHOT="$RUNNER_TEMP/hobah-home-smoke.png"
          python3 - "$APP" "$SHOT" <<'PY'
          import json, os, subprocess, sys, time
          app, shot = sys.argv[1:]

          def run(args, timeout=12, check=False):
              try:
                  p=subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=timeout)
              except subprocess.TimeoutExpired as e:
                  return 124, (e.stdout or ''), (e.stderr or '')
              if check and p.returncode:
                  raise SystemExit(f"command failed ({p.returncode}): {' '.join(args)}\n{p.stderr}")
              return p.returncode,p.stdout,p.stderr

          code,out,err=run(['xcrun','simctl','list','devices','available','-j'],20,True)
          data=json.loads(out)
          candidates=[]
          for runtime,devices in data.get('devices',{}).items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and str(d.get('name','')).startswith('iPhone'):
                      candidates.append((runtime,d.get('name',''),d.get('udid','')))
          candidates.sort(reverse=True)
          if not candidates:
              raise SystemExit('No available iPhone simulator')
          runtime,name,udid=candidates[0]
          print('Using simulator:',runtime,name,udid)

          run(['xcrun','simctl','shutdown','all'],8)
          run(['xcrun','simctl','boot',udid],10)

          installed=False
          last=''
          for attempt in range(8):
              code,out,err=run(['xcrun','simctl','install',udid,app],8)
              last=(err or out or '').strip()
              if code==0:
                  installed=True
                  print('App installed on simulator')
                  break
              print(f'Install attempt {attempt+1}/8 not ready: code={code} {last[-300:]}')
              time.sleep(4)
          if not installed:
              raise SystemExit('iPhone simulator did not become install-ready within bounded retries: '+last[-500:])

          code,out,err=run(['xcrun','simctl','launch',udid,'com.hobah.bible'],15)
          if code:
              raise SystemExit('Hobah failed to launch in simulator: '+(err or out)[-500:])
          print('Launch:',out.strip())
          time.sleep(8)

          code,out,err=run(['xcrun','simctl','io',udid,'screenshot',shot],15)
          if code:
              raise SystemExit('Simulator screenshot failed: '+(err or out)[-500:])
          if not os.path.isfile(shot) or os.path.getsize(shot)<25000:
              raise SystemExit('Simulator screenshot is missing or unexpectedly small')
          print('iPhone launch smoke screenshot bytes:',os.path.getsize(shot))
          PY
          echo "SMOKE_SCREENSHOT=$SHOT" >> "$GITHUB_ENV"

      - name: Archive launch smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: hobah-ios-launch-smoke
          path: ${{ env.SMOKE_SCREENSHOT }}
          if-no-files-found: error

      - name: Archive compiled Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: hobah-ios-simulator-app
          path: native-ios/ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error

      - name: Archive generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: hobah-ios-xcode-project
          path: |
            native-ios/ios/App
            !native-ios/ios/build
          if-no-files-found: error

      - name: Publish compiler status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version 2>/dev/null | tr '\n' ' ' || true)"
          BODY=$(cat <<EOF
          # Hobah iOS Compiler Status

          - status: ${JOB_STATUS}
          - source_commit: ${GITHUB_SHA}
          - run_id: ${GITHUB_RUN_ID}
          - xcode: ${XCODE_VERSION:-unavailable}
          - checked_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - native_voice_study: enabled
          - simulator_target: iPhone/iPad
          - launch_smoke: automated iPhone simulator launch + screenshot with bounded simctl calls
          EOF
          )
          ENCODED="$(printf '%s' "$BODY" | base64)"
          REPO="${GITHUB_REPOSITORY}"
          STATUS_BRANCH="ci-ios-status"
          if ! gh api "repos/${REPO}/git/ref/heads/${STATUS_BRANCH}" >/dev/null 2>&1; then
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/heads/${STATUS_BRANCH}" -f sha="${GITHUB_SHA}" >/dev/null
          fi
          OLD_SHA="$(gh api "repos/${REPO}/contents/ios-simulator-status.md?ref=${STATUS_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$OLD_SHA" ]; then
            gh api -X PUT "repos/${REPO}/contents/ios-simulator-status.md" \
              -f message="Update Hobah iOS compiler status" \
              -f content="$ENCODED" \
              -f branch="$STATUS_BRANCH" \
              -f sha="$OLD_SHA" >/dev/null
          else
            gh api -X PUT "repos/${REPO}/contents/ios-simulator-status.md" \
              -f message="Publish Hobah iOS compiler status" \
              -f content="$ENCODED" \
              -f branch="$STATUS_BRANCH" >/dev/null
          fi
