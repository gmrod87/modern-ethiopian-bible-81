name: Release 95 Books Navigation Preflight

on:
  push:
    branches: [release95-books-reader-polish]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install
      - name: Build production Hobah
        run: npm run build
      - name: Verify Release 95 Books layer
        run: |
          node --check dist/release94-ancient-library.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('dist/ancient-library.json').read_text())
          sections=data.get('sections',[])
          chars=int(data.get('total_characters') or sum(int(x.get('chars',0)) for x in sections))
          assert len(sections) >= 180, len(sections)
          assert chars >= 10_000_000, chars
          js=Path('dist/release94-ancient-library.js').read_text()
          css=Path('dist/release94-ancient-library.css').read_text()
          html=Path('dist/index.html').read_text()
          assert 'ancientPageReader' in js
          assert 'ancientReaderSheet' not in js
          assert 'About this text' not in js
          assert 'Provenance</dt>' not in js
          assert 'touch-action:pan-y' in css
          assert 'overflow-x:auto' not in css
          assert 'release94-ancient-library.js?v=95' in html
          assert 'release94-ancient-library.css?v=95' in html
          print(f'Release 95 Books preflight: {len(sections)} readings / {chars:,} characters')
          PY
      - name: Install native dependencies
        working-directory: native-ios
        run: npm install
      - name: Prepare native offline bundle
        working-directory: native-ios
        run: npm run prepare:web
      - name: Bundle native bridge
        working-directory: native-ios
        run: npm run build:bridge
      - name: Verify native bundle and doctor
        working-directory: native-ios
        run: |
          test -f www/ancient-library.json
          test -f www/release94-ancient-library.js
          test -f www/release94-ancient-library.css
          npm run doctor
