name: Build Complete Ancient Library PDF

# Research build trigger: fixed builder 2026-08-22
on:
  push:
    branches: [main, ancient-library-complete-book]
    paths:
      - 'ancient-library/build_complete_ancient_library.py'
      - '.github/workflows/build-complete-ancient-library.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ancient-library/build_complete_ancient_library.py'
      - '.github/workflows/build-complete-ancient-library.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research build branch
        uses: actions/checkout@v4
        with:
          ref: ancient-library-complete-book
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml weasyprint pypdf

      - name: Build anthology
        run: python ancient-library/build_complete_ancient_library.py

      - name: Verify PDF
        run: |
          test -s ancient-library/output/The_Ancient_Canon_Complete_Ancient_Library.pdf
          python - <<'PY'
          from pypdf import PdfReader
          import os
          p='ancient-library/output/The_Ancient_Canon_Complete_Ancient_Library.pdf'
          r=PdfReader(p)
          print('PAGES',len(r.pages))
          print('SIZE',os.path.getsize(p))
          assert len(r.pages) > 100, 'Anthology unexpectedly short'
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ancient-library-complete-book
          path: |
            ancient-library/output/The_Ancient_Canon_Complete_Ancient_Library.pdf
            ancient-library/output/SOURCE_COVERAGE.md
            ancient-library/output/ancient_library_complete_manifest.json
          retention-days: 30

      - name: Commit generated sources and PDF to research branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ancient-library/output
          git commit -m 'Build complete Ancient Library reading edition' || exit 0
          git push origin HEAD:ancient-library-complete-book
